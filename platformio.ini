[env:m5stack-cores3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
; COM1 はマザーボードのレガシーシリアルポート。
; 自動検出だとそれを掴んでしまうので CoreS3 側だけに絞る
upload_port = COM3
monitor_port = COM3
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -fpermissive
lib_deps =
    m5stack/M5Unified
    mikalhart/TinyGPSPlus